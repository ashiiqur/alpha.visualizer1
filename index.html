<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coming Soon</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,Arial,sans-serif;
}

body{
    height:100vh;
    background:linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb);
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    overflow:hidden;
}

.container{
    text-align:center;
    padding:40px;
    max-width:700px;
}

.logo{
    width:100px;
    height:100px;
    margin:auto;
    border-radius:50%;
    background:white;
    color:#2563eb;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:40px;
    font-weight:bold;
    box-shadow:0 15px 40px rgba(0,0,0,.3);
    margin-bottom:30px;
}

h1{
    font-size:60px;
    margin-bottom:15px;
}

p{
    font-size:20px;
    color:#dbeafe;
    margin-bottom:40px;
}

.countdown{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
}

.box{
    background:rgba(255,255,255,.12);
    backdrop-filter:blur(8px);
    padding:20px;
    border-radius:15px;
    width:90px;
}

.box span{
    display:block;
    font-size:32px;
    font-weight:bold;
}

.box small{
    color:#cbd5e1;
}

footer{
    margin-top:50px;
    color:#cbd5e1;
    font-size:14px;
}

@media(max-width:600px){
    h1{
        font-size:42px;
    }

    p{
        font-size:18px;
    }
}
</style>

</head>
<body>

<div class="container">

<div class="logo">
🚀
</div>

<h1>Coming Soon</h1>

<p>
Our website is currently under construction.<br>
We're working hard to bring you something amazing.
</p>

<div class="countdown">

<div class="box">
<span id="days">00</span>
<small>Days</small>
</div>

<div class="box">
<span id="hours">00</span>
<small>Hours</small>
</div>

<div class="box">
<span id="minutes">00</span>
<small>Minutes</small>
</div>

<div class="box">
<span id="seconds">00</span>
<small>Seconds</small>
</div>

</div>

<footer>
© 2026 Your Website • All Rights Reserved
</footer>

</div>

<script>

// Set launch date here
const launch = new Date("December 31, 2026 23:59:59").getTime();

setInterval(function(){

const now = new Date().getTime();
const distance = launch - now;

const days = Math.floor(distance/(1000*60*60*24));
const hours = Math.floor((distance%(1000*60*60*24))/(1000*60*60));
const minutes = Math.floor((distance%(1000*60*60))/(1000*60));
const seconds = Math.floor((distance%(1000*60))/1000);

document.getElementById("days").innerHTML = Math.max(0,days);
document.getElementById("hours").innerHTML = Math.max(0,hours);
document.getElementById("minutes").innerHTML = Math.max(0,minutes);
document.getElementById("seconds").innerHTML = Math.max(0,seconds);

},1000);

</script>

</body>
</html>
